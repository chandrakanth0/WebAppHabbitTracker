<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            width: 350px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .toggle-btn {
            margin-bottom: 20px;
            cursor: pointer;
            font-weight: bold;
            color: blue;
            text-decoration: underline;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #signup-form {
            display: none;
        }
        .message {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="toggle-form">
        <span class="toggle-btn" onclick="toggleForms()">Switch to Signup</span>
    </div>

    <!-- Login Form -->
    <div id="login-form">
        <h2>Login</h2>
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button onclick="login()">Login</button>
        <p class="message" id="login-message"></p>
    </div>

    <!-- Signup Form -->
    <div id="signup-form">
        <h2>Signup</h2>
        <input type="text" id="signup-firstname" placeholder="First Name" required>
        <input type="text" id="signup-lastname" placeholder="Last Name" required>
        <input type="email" id="signup-email" placeholder="Email" required>
        <input type="password" id="signup-password" placeholder="Password" required>
        <input type="date" id="signup-age" required>
        <button onclick="signup()">Signup</button>
        <p class="message" id="signup-message"></p>
    </div>
</div>

<script>
    function toggleForms() {
        const loginForm = document.getElementById("login-form");
        const signupForm = document.getElementById("signup-form");
        const toggleBtn = document.querySelector(".toggle-btn");

        if (loginForm.style.display === "none") {
            loginForm.style.display = "block";
            signupForm.style.display = "none";
            toggleBtn.textContent = "Switch to Signup";
        } else {
            loginForm.style.display = "none";
            signupForm.style.display = "block";
            toggleBtn.textContent = "Switch to Login";
        }
    }
    async function login() {
        console.log("called login");
    const email = document.getElementById("login-email").value;
    const password = document.getElementById("login-password").value;
    const loginMessage = document.getElementById("login-message");

    try {
        const response = await fetch("http://localhost:3000/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
        });

        const data = await response.json();
        if (response.ok) {
            loginMessage.style.color = "green";
            loginMessage.textContent = "Login successful! Redirecting...";
            
            // ✅ Store JWT token in localStorage
            localStorage.setItem("token", data.token);

            // ✅ Redirect with token included
            setTimeout(() => {
                window.location.href = "/dashboard";
            }, 2000);
        } else {
            loginMessage.style.color = "red";
            loginMessage.textContent = data.message;
        }
    } catch (error) {
        loginMessage.textContent = "Error logging in";
    }
}


async function signup() {
    const firstName = document.getElementById("signup-firstname").value;
    const lastName = document.getElementById("signup-lastname").value;
    const email = document.getElementById("signup-email").value;
    const password = document.getElementById("signup-password").value;
    const age = document.getElementById("signup-age").value;
    const signupMessage = document.getElementById("signup-message");

    try {
        const response = await fetch("http://localhost:3000/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ firstName, lastName, email, password, age })
        });

        const data = await response.json();
        if (response.ok) {
            signupMessage.style.color = "green";
            signupMessage.textContent = "Signup successful! Redirecting to login...";
            clearInputs();
            setTimeout(() => toggleForms(), 2000);
        } else {
            signupMessage.style.color = "red";
            signupMessage.textContent = data.message;
        }
    } catch (error) {
        signupMessage.textContent = "Error signing up";
    }
}

function clearInputs() {
    document.querySelectorAll("input").forEach(input => input.value = "");
}

</script>

</body>
</html>
