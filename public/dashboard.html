<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Habit Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="daily-habit.html">Daily Habit Tracking</a></li>
            <li><a href="status.html">Habit Status & Progress</a></li>
            <li><a href="priority.html">Priority-wise Habit</a></li>
            <li><a href="profile.html">User Profile</a></li>
            <li><a href="index.html" onclick="logout()">Logout</a></li>
        </ul>
    </nav>

    <!-- Dashboard Content -->
    <div class="container">
        <h1>Welcome, <span id="user-name"></span>!</h1>
        <p>Track your daily habits and build a better lifestyle!</p>

        <!-- Random Quote Section -->
        <div id="quote-section">
            <h2>Today's Motivation</h2>
            <p id="quote"></p>
        </div>

        <!-- Habit List -->
        <div id="habits">
            <h2>Your Habits</h2>
            <ul id="habit-list">
                <!-- Habits will be dynamically added here -->
            </ul>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("token");
        const userData = JSON.parse(localStorage.getItem("user"));

        // Redirect to login if not authenticated
        if (!token || !userData) {
            window.location.href = "/";
        }

        // Set User Name
        document.getElementById("user-name").textContent = userData.firstName;

        // Fetch and Display Random Quote
        async function fetchQuote() {
            try {
                const response = await fetch("https://api.quotable.io/random");
                const data = await response.json();
                document.getElementById("quote").textContent = `"${data.content}" - ${data.author}`;
            } catch (error) {
                document.getElementById("quote").textContent = "Stay motivated and keep pushing!";
            }
        }
        fetchQuote();

        // Fetch and Display User's Habits
        async function fetchHabits() {
            try {
                const response = await fetch("http://localhost:3000/habits", {
                    method: "GET",
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const data = await response.json();
                const habitList = document.getElementById("habit-list");

                if (data.habits.length === 0) {
                    habitList.innerHTML = "<li>No habits found. Start adding new habits!</li>";
                    return;
                }

                habitList.innerHTML = "";
                data.habits.forEach(habit => {
                    const li = document.createElement("li");
                    li.textContent = `${habit.name} - ${habit.status}`;
                    habitList.appendChild(li);
                });
            } catch (error) {
                document.getElementById("habit-list").innerHTML = "<li>Error fetching habits.</li>";
            }
        }
        fetchHabits();

        // Logout Function
        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "/";
        }
    </script>

</body>
</html>
